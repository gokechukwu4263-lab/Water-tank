  const hud=document.getElementById('hud');
  hud.innerHTML=`<span class="chip"><span class="dot" id="hPUMP"></span>PUMP ON</span><span class="chip"><span class="dot" id="hFULL"></span>FULL</span><span class="chip"><span class="dot" id="hALARM"></span>ALARM</span><span class="chip"><span class="dot" id="hLOW"></span>LOW</span><span class="chip"><span class="dot" id="hMEDIUM"></span>MEDIUM</span><span class="chip"><span class="dot" id="hFAULT"></span>FAULT</span>
<span>Level <span class="v" id="vL">00</span></span><span>Register <span class="v" id="vR">00</span></span><span>Counter <span class="v" id="vC">00</span></span><span>Cycle <span class="v" id="vN">0</span></span>`;
  const HC={PUMP:'#1fa84f',FULL:'#2d7ff9',ALARM:'#d62828',LOW:'#f2a900',MEDIUM:'#f2a900',FAULT:'#b040d0'};
  let cycles=0;
  function refresh(){
    applyInputs();
    wireEls.forEach(([e,n])=>e.setAttribute('stroke',col(val[n])));
    tunEls.forEach(([e,n])=>e.setAttribute('stroke',col(val[n])));
    pinEls.forEach(([r,t,p])=>{const v=inState[p.label];t.textContent=v;r.setAttribute('fill',v?'#b6f5c9':'#fff');});
    outEls.forEach(([r,t,p])=>{const v=val[p.net];t.textContent=v===undefined?'?':v;r.setAttribute('fill',v?'#b6f5c9':'#fff');});
    ledEls.forEach(([c,l])=>c.setAttribute('fill',val[l.net]?l.color:'#555'));
    ffEls.forEach(([t,n])=>t.textContent=val[n]===undefined?'?':val[n]);
    for(const k in segEls)segEls[k].setAttribute('fill',val[S.nets[k]]?'#e8281c':'#d9dbe3');
    for(const k in HC){const d=document.getElementById('h'+k);d.style.background=named(k)?HC[k]:'#c3c9d8';}
    document.getElementById('vL').textContent=''+named('L1')+named('L0');
    document.getElementById('vR').textContent=''+named('REG1')+named('REG0');
    document.getElementById('vC').textContent=''+named('CNT1')+named('CNT0');
    document.getElementById('vN').textContent=cycles;
  }
  function tick(){inState['CLK']=1;cycles++;refresh();inState['CLK']=0;refresh();}
  document.getElementById('tick').onclick=tick;
  let timer=null;const spd=()=>[1500,1000,650,400,220,110][+document.getElementById('spd').value-1];
  function auto(on){clearInterval(timer);timer=null;const b=document.getElementById('auto');b.setAttribute('aria-pressed',on);b.textContent=on?'Auto ■':'Auto ▷';if(on)timer=setInterval(tick,spd());}
  document.getElementById('auto').onclick=()=>auto(!timer);document.getElementById('spd').oninput=()=>{if(timer)auto(true);};
  document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{const l=+b.dataset.lv;inState.S0=1;inState.S1=+(l>=1);inState.S2=+(l>=2);inState.S3=+(l>=3);refresh();});
  document.getElementById('rpulse').onclick=()=>{inState.RESET=1;refresh();tick();inState.RESET=0;refresh();};
  // ---------------- pan / zoom ----------------
  let vb=[bx0,by0,bx1-bx0,by1-by0],moved=0;
  const V={all:D.bounds,in:[20,70,940,500],cmp:[320,520,960,890],reg:[250,960,1900,1400],cnt:[200,1690,1500,2080],out:[1830,520,2260,1180],dsp:[2380,70,3600,1480]};
  function setVB(){svg.setAttribute('viewBox',vb.join(' '));}
  function fit(r){const [x0,y0,x1,y1]=r,W=stage.clientWidth,H=stage.clientHeight,w=x1-x0,h=y1-y0,s=Math.min(W/w,H/h);vb=[x0-(W/s-w)/2,y0-(H/s-h)/2,W/s,H/s];setVB();}
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>fit(V[b.dataset.view]));
  let drag=null;
  stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vb:vb.slice()};moved=0;});
  window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));if(moved>4){stage.classList.add('drag');const s=vb[2]/stage.clientWidth;vb=[drag.vb[0]-dx*s,drag.vb[1]-dy*s,vb[2],vb[3]];setVB();}});
  window.addEventListener('pointerup',()=>{drag=null;stage.classList.remove('drag');setTimeout(()=>moved=0,0);});
  stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?1.15:1/1.15,r=stage.getBoundingClientRect(),px=vb[0]+(e.clientX-r.left)/r.width*vb[2],py=vb[1]+(e.clientY-r.top)/r.height*vb[3];
    vb=[px-(px-vb[0])*f,py-(py-vb[1])*f,vb[2]*f,vb[3]*f];setVB();},{passive:false});
  let pinch=null;
  stage.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){const f=pinch/d,r=stage.getBoundingClientRect(),cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2,px=vb[0]+(cx-r.left)/r.width*vb[2],py=vb[1]+(cy-r.top)/r.height*vb[3];vb=[px-(px-vb[0])*f,py-(py-vb[1])*f,vb[2]*f,vb[3]*f];setVB();}pinch=d;}},{passive:false});
  stage.addEventListener('touchend',()=>pinch=null);
  window.addEventListener('resize',()=>fit(V.all));
  // start: tank empty (S0 wet), reset pulse so everything is defined
  inState.S0=1;refresh();inState.RESET=1;tick();inState.RESET=0;refresh();cycles=0;refresh();
  fit(V.in);
</script>
</body>
</html>
